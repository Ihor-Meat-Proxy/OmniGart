name: Body map

on:
  push:
    branches: [main]
    paths:
      - 'design/body-map/**'
      - 'shared/bodymap/**'
      - 'content/exercises/**'
      - 'settings.gradle.kts'
      - '.github/workflows/body-map.yml'
  pull_request:
    paths:
      - 'design/body-map/**'
      - 'shared/bodymap/**'
      - 'content/exercises/**'
      - 'settings.gradle.kts'
      - '.github/workflows/body-map.yml'

concurrency:
  group: body-map-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  body-map:
    name: Body map
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: design/body-map/tools/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install SVG adapt dependencies
        run: pip install shapely svgpathtools
      - name: Install body-map tools
        working-directory: design/body-map/tools
        run: npm ci
      - name: Check body maps (SVG, mapping, golden paths, previews)
        working-directory: design/body-map/tools
        run: npm run check
      - name: Unit tests (shared/bodymap)
        run: ./gradlew --no-daemon :shared:bodymap:jvmTest
