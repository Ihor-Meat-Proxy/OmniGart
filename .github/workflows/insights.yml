name: Insights

on:
  push:
    paths:
      - 'shared/insights/**'
      - 'shared/evidence/**'
      - 'content/evidence/**'
      - '.github/workflows/insights.yml'
  pull_request:
    paths:
      - 'shared/insights/**'
      - 'shared/evidence/**'
      - 'content/evidence/**'
      - '.github/workflows/insights.yml'

concurrency:
  group: insights-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Insights:
    name: Insights
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: shared/insights + evidence unit tests
        run: ./gradlew --stacktrace :shared:evidence:jvmTest :shared:insights:jvmTest
