name: Achievements

on:
  push:
    paths:
      - 'content/achievements/**'
      - 'shared/achievements/**'
      - 'design/icons/manifest.json'
      - '.github/workflows/achievements.yml'
  pull_request:
    paths:
      - 'content/achievements/**'
      - 'shared/achievements/**'
      - 'design/icons/manifest.json'
      - '.github/workflows/achievements.yml'

jobs:
  Achievements:
    name: Achievements
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: content/achievements/tools/package-lock.json

      - name: Install validator dependencies
        working-directory: content/achievements/tools
        run: npm ci

      - name: Validate achievement catalogue
        working-directory: content/achievements/tools
        run: npm run validate

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run achievements engine tests
        run: ./gradlew :shared:achievements:jvmTest --no-daemon
