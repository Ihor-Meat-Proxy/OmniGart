# Minimal single-node Garage config for lab / self-host.
# Replace rpc_secret and create a bucket via garage CLI after first boot.
# Docs: https://garagehq.deuxfleurs.fr/

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "CHANGE_ME_TO_A_64_HEX_CHARS_SECRET______________________________"

[s3_api]
api_bind_addr = "[::]:3900"
s3_region = "eu-central-1"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "CHANGE_ME_ADMIN_TOKEN"
