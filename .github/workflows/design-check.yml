name: Design check

on:
  push:
    branches: [main]
    paths:
      - 'design/**'
      - '.github/workflows/design-check.yml'
  pull_request:
    paths:
      - 'design/**'
      - '.github/workflows/design-check.yml'

concurrency:
  group: design-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design/tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: design/tools/package-lock.json
      - run: npm ci
      - run: npm run check
