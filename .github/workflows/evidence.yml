name: Evidence

on:
  push:
    paths:
      - 'content/evidence/**'
      - 'content/exercises/**'
      - 'shared/evidence/**'
      - 'shared/planning/src/commonMain/kotlin/com/omnigart/planning/EvidenceCatalog.kt'
      - 'tooling/evidence/**'
      - '.github/workflows/evidence.yml'
  pull_request:
    paths:
      - 'content/evidence/**'
      - 'content/exercises/**'
      - 'shared/evidence/**'
      - 'shared/planning/src/commonMain/kotlin/com/omnigart/planning/EvidenceCatalog.kt'
      - 'tooling/evidence/**'
      - '.github/workflows/evidence.yml'

concurrency:
  group: evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Evidence:
    name: Evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tooling/evidence/package-lock.json

      - name: Install evidence tooling
        working-directory: tooling/evidence
        run: npm ci

      - name: Validate evidence registry (offline)
        working-directory: tooling/evidence
        run: npm run validate

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: shared/evidence unit tests
        run: ./gradlew :shared:evidence:jvmTest --no-daemon
