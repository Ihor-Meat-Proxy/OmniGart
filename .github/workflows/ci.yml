# Main CI — path-filtered jobs, draft skip, macOS behind a cheap Linux lint gate.
# Stack (#23): also pack/verify content bundle, hydration/body tests, App Review gates.
# Action SHAs pinned (Oct 2026).
name: CI

on:
  # Avoid double-runs: do not also push-trigger every cursor/** branch (PRs already fire pull_request).
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel in-flight runs. Cancelling hid WorkoutKit / Swift compile failures
  # when a later push arrived before the macOS iOS + watchOS job finished.
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      design: ${{ steps.filter.outputs.design }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            android:
              - 'androidApp/**'
              - 'wearApp/**'
              - 'android/**'
              - 'shared/**'
              - 'content/**'
              - 'generated/content-bundle/**'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/libs.versions.toml'
              - 'config/detekt/**'
              - 'scripts/check_no_ru_locale.sh'
              - 'scripts/check_app_review_compliance.py'
              - 'scripts/pack_bundled_content.py'
              - '.github/workflows/ci.yml'
            ios:
              - 'iosApp/**'
              - 'watchApp/**'
              - 'ios/**'
              - 'shared/**'
              - 'content/**'
              - 'generated/content-bundle/**'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/libs.versions.toml'
              - 'design/generated/ios/**'
              - '.swiftlint.yml'
              - 'scripts/check_no_ru_locale.sh'
              - 'scripts/check_app_review_compliance.py'
              - 'scripts/pack_bundled_content.py'
              - '.github/workflows/ci.yml'
            design:
              - 'design/**'
              - '.github/workflows/design-check.yml'

  # Cheap Linux gate — fails fast before macOS minutes are spent.
  lint-gate:
    name: Lint gate
    needs: changes
    if: |
      always()
      && needs.changes.result == 'success'
      && (needs.changes.outputs.android == 'true' || needs.changes.outputs.ios == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No Russian locales
        run: bash ./scripts/check_no_ru_locale.sh
      - name: App Review compliance (copy, permissions, debug gates)
        # Pure stdlib Python — no pip/PyYAML (macOS runners are PEP 668 managed).
        run: python3 scripts/check_app_review_compliance.py
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: ktlint + detekt
        run: ./gradlew --stacktrace ktlintCheck detekt
      # SwiftLint: full SourceKit lint stays on the iOS + watchOS macOS job and on the
      # dedicated SwiftLint workflow (.github/workflows/swiftlint.yml). That separate
      # workflow exists so cancel-in-progress on this CI.yml cannot skip Apple style
      # checks when a later push cancels the long xcodebuild job mid-flight.

  kmp-android:
    name: KMP + Android + Wear
    needs: [changes, lint-gate]
    if: |
      always()
      && needs.changes.result == 'success'
      && needs.lint-gate.result == 'success'
      && needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Pack and verify offline content bundle
        # Bundle-first: generated/content-bundle must match content/ + design sources.
        run: |
          python3 scripts/pack_bundled_content.py
          python3 scripts/pack_bundled_content.py --verify
          ./gradlew verifyBundledContent
      - name: Unit tests and assemble
        run: |
          ./gradlew --stacktrace \
            :shared:testAndroidHostTest \
            :shared:planning:jvmTest \
            :shared:hydration:jvmTest \
            :shared:body:jvmTest \
            :androidApp:assembleDebug \
            :androidApp:testDebugUnitTest \
            :wearApp:assembleDebug \
            :wearApp:testDebugUnitTest
      - name: Gradle verification hooks
        # checkNoRuLocale / checkAppReviewCompliance / verifyBundledContent also hang off root `check`.
        run: ./gradlew checkNoRuLocale checkAppReviewCompliance verifyBundledContent

  ios-watchos:
    name: iOS + watchOS
    needs: [changes, lint-gate]
    # Expensive macOS job — only after Linux lint-gate, and only when iOS/shared/KMP paths change.
    if: |
      always()
      && needs.changes.result == 'success'
      && needs.lint-gate.result == 'success'
      && needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Select newest available Xcode
        run: |
          ls /Applications | grep -i Xcode || true
          for candidate in \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.1.app \
            /Applications/Xcode_26.0.app \
            /Applications/Xcode_26.app \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode.app
          do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
              echo "Selected $candidate"
              break
            fi
          done
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun --sdk watchsimulator --show-sdk-version
      - name: Verify design generated sources
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          SOURCES=(
            "$ROOT/design/generated/ios/Sources/Color+OmniGart.swift"
            "$ROOT/design/generated/ios/Sources/Font+OmniGart.swift"
            "$ROOT/design/generated/ios/Sources/OmniGartMetrics.swift"
          )
          for f in "${SOURCES[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error::Missing design source: $f"
              exit 1
            fi
            echo "ok $f"
          done
          test -d "$ROOT/design/generated/ios/OmniGartColors.xcassets"
          test -d "$ROOT/design/generated/ios/OmniGartIcons.xcassets"
          if ! grep -q 'path: ../design/generated/ios/Sources' iosApp/project.yml; then
            echo "::error::iosApp/project.yml missing ../design/generated/ios/Sources"
            exit 1
          fi
      - name: Install XcodeGen and SwiftLint
        run: brew install xcodegen swiftlint
      - name: App Review compliance (copy, permissions, privacy manifest)
        # Same gates as the Linux job; keeps iOS-only plist/PrivacyInfo regressions visible here.
        run: python3 scripts/check_app_review_compliance.py
      - name: SwiftLint
        run: swiftlint lint --config .swiftlint.yml --strict
      - name: Link and sync Shared frameworks (simulator)
        run: |
          # Version-agnostic paths: Debug/iphonesimulator and Debug/watchsimulator
          # (matches FRAMEWORK_SEARCH_PATHS $(PLATFORM_NAME) in iosApp/project.yml).
          # Two Gradle invocations so sync always sees freshly linked frameworks
          # (syncXcodeFrameworks also mustRunAfter link*Framework* in build.gradle.kts).
          ./gradlew \
            linkDebugFrameworkIosSimulatorArm64 \
            linkDebugFrameworkWatchosSimulatorArm64 \
            --stacktrace
          ./gradlew syncXcodeFrameworks --stacktrace
          test -d shared/build/xcode-frameworks/Debug/iphonesimulator/Shared.framework
          test -d shared/build/xcode-frameworks/Debug/watchsimulator/Shared.framework

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          cd iosApp
          xcodegen generate
          PBX=OmniGart.xcodeproj/project.pbxproj
          if grep -E 'design/generated/.+/design/generated' "$PBX" 2>/dev/null; then
            echo "::error::XcodeGen produced a nested design/generated path in $PBX"
            exit 1
          fi
          if ! grep -q '\.\./design/generated/ios/Sources' "$PBX"; then
            echo "::error::$PBX missing ../design/generated/ios/Sources references"
            exit 1
          fi
      - name: Build iOS + watchOS (simulator, arm64)
        env:
          # Frameworks already linked+synced above; skip Gradle inside Xcode pre-build.
          OMNIGART_SKIP_XCODE_GRADLE: "1"
        run: |
          set -euo pipefail
          xcodebuild -project iosApp/OmniGart.xcodeproj -scheme OmniGart \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            EXCLUDED_ARCHS=x86_64 \
            CODE_SIGNING_ALLOWED=NO \
            build
          xcodebuild -project iosApp/OmniGart.xcodeproj -scheme OmniGartWatch \
            -destination 'generic/platform=watchOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            EXCLUDED_ARCHS=x86_64 \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Test iOS + watchOS (booted simulators)
        env:
          OMNIGART_SKIP_XCODE_GRADLE: "1"
        run: |
          set -euo pipefail
          IOS_DEST=$(
            xcodebuild -project iosApp/OmniGart.xcodeproj -scheme OmniGart -showdestinations 2>/dev/null \
              | grep 'platform:iOS Simulator' \
              | grep 'arch:arm64' \
              | grep -v 'placeholder' \
              | head -1 \
              | sed -n 's/.*name:\([^,}]*\).*/\1/p' \
              | xargs
          )
          WATCH_DEST=$(
            xcodebuild -project iosApp/OmniGart.xcodeproj -scheme OmniGartWatch -showdestinations 2>/dev/null \
              | grep 'platform:watchOS Simulator' \
              | grep 'arch:arm64' \
              | grep -v 'placeholder' \
              | head -1 \
              | sed -n 's/.*name:\([^,}]*\).*/\1/p' \
              | xargs
          )
          echo "iOS destination name: ${IOS_DEST}"
          echo "watchOS destination name: ${WATCH_DEST}"
          test -n "${IOS_DEST}"
          test -n "${WATCH_DEST}"

          IOS_UDID=$(xcrun simctl list devices available | grep -F "${IOS_DEST}" | grep -oE '[0-9A-F-]{36}' | head -1 || true)
          if [[ -n "${IOS_UDID}" ]]; then
            xcrun simctl boot "${IOS_UDID}" 2>/dev/null || true
            xcrun simctl bootstatus "${IOS_UDID}" -b
          fi

          xcodebuild -project iosApp/OmniGart.xcodeproj -scheme OmniGart \
            -destination "platform=iOS Simulator,name=${IOS_DEST},arch=arm64" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:OmniGartTests \
            test
          xcodebuild -project iosApp/OmniGart.xcodeproj -scheme OmniGart \
            -destination "platform=iOS Simulator,name=${IOS_DEST},arch=arm64" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:OmniGartUITests \
            -retry-tests-on-failure \
            -test-iterations 3 \
            test
          xcodebuild -project iosApp/OmniGart.xcodeproj -scheme OmniGartWatch \
            -destination "platform=watchOS Simulator,name=${WATCH_DEST},arch=arm64" \
            CODE_SIGNING_ALLOWED=NO \
            test
