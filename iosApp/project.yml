name: OmniGart
options:
  bundleIdPrefix: com.omnigart
  # Matches CFBundleDevelopmentRegion / String Catalog sourceLanguage (en-GB).
  developmentLanguage: en-GB
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  # In-project groups stay tidy. External design paths set createIntermediateGroups:
  # false so XcodeGen does not nest the design tree under a parent that already
  # resolves through ../design/generated (that previously doubled the path on Watch).
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  SWIFT_VERSION: "6.0"
  DEVELOPMENT_TEAM: ""
  # Product targets iOS 26+ / watchOS 26+ on owner machines; CI (Xcode 16.4) caps at
  # iOS 18 / watchOS 11. Keep build settings aligned with the available SDK.
  IPHONEOS_DEPLOYMENT_TARGET: "18.0"
  WATCHOS_DEPLOYMENT_TARGET: "11.0"

targets:
  OmniGart:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    preBuildScripts:
      - &syncSharedFramework
        name: Sync Shared.framework
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          bash "${SRCROOT}/../scripts/xcode_sync_shared_framework.sh"
      - name: Pack OmniGart Content
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          # Pack into a temp dir (not generated/content-bundle) so Xcode Run
          # does not dirty the committed baseline.
          ROOT="${SRCROOT}/.."
          DEST="${SRCROOT}/OmniGart/ContentBundle"
          TMP="$(mktemp -d "${TMPDIR:-/tmp}/omnigart-content.XXXXXX")"
          trap 'rm -rf "$TMP"' EXIT
          /usr/bin/python3 "$ROOT/scripts/pack_bundled_content.py" --out "$TMP"
          rm -rf "$DEST"
          cp -R "$TMP" "$DEST"
    sources:
      - path: OmniGart
        excludes:
          - PrivacyInfo.xcprivacy
          - "**/*.lproj/**"
          - ContentBundle/**
      - &designSwiftSources
        path: ../design/generated/ios/Sources
        name: Design
        createIntermediateGroups: false
    resources:
      # Do not use type:folder for .xcassets — that creates a folder reference and
      # Xcode will not compile imagesets (tab icons then missing at runtime).
      - &designColorAssets
        path: ../design/generated/ios/OmniGartColors.xcassets
        name: OmniGartColors
        createIntermediateGroups: false
      - &designIconAssets
        path: ../design/generated/ios/OmniGartIcons.xcassets
        name: OmniGartIcons
        createIntermediateGroups: false
      - path: OmniGart/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: OmniGart/en-GB.lproj
      - path: OmniGart/uk.lproj
      - path: OmniGart/ContentBundle
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omnigart.ios
        INFOPLIST_FILE: OmniGart/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        # PLATFORM_NAME (not versioned SDK_NAME) so SDK 18 / 26 / 27+ share one path.
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(PLATFORM_NAME)"
        # Shared (SQLDelight / SQLIter) needs the system SQLite at link time.
        OTHER_LDFLAGS: "$(inherited) -framework Shared -lsqlite3 -framework WatchConnectivity"
        ENABLE_PREVIEWS: YES
        ONLY_ACTIVE_ARCH: YES
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: "i386"
        CODE_SIGN_ENTITLEMENTS: OmniGart/OmniGart.entitlements
    dependencies:
      - target: OmniGartWatch
        embed: true
      - sdk: WatchConnectivity.framework
    scheme:
      testTargets:
        - OmniGartTests
        - OmniGartUITests

  OmniGartTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: OmniGartTests
    dependencies:
      - target: OmniGart
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omnigart.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(PLATFORM_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Shared -lsqlite3"

  OmniGartUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: OmniGartUITests
    dependencies:
      - target: OmniGart
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omnigart.ios.uitests
        GENERATE_INFOPLIST_FILE: YES

  OmniGartWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    preBuildScripts:
      - *syncSharedFramework
      - name: Pack OmniGart Content
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          ROOT="${SRCROOT}/.."
          DEST="${SRCROOT}/../watchApp/OmniGartWatch/ContentBundle"
          TMP="$(mktemp -d "${TMPDIR:-/tmp}/omnigart-content.XXXXXX")"
          trap 'rm -rf "$TMP"' EXIT
          /usr/bin/python3 "$ROOT/scripts/pack_bundled_content.py" --out "$TMP"
          rm -rf "$DEST"
          cp -R "$TMP" "$DEST"
    sources:
      - path: ../watchApp/OmniGartWatch
        createIntermediateGroups: false
        excludes:
          - ContentBundle/**
          # Catalog is listed under resources so it is compiled as a String Catalog
          # (not treated as an opaque source file).
          - Localizable.xcstrings
      - *designSwiftSources
    resources:
      - *designColorAssets
      - *designIconAssets
      # Catalog must live under the watch app tree (not a cross-path to iosApp).
      # A shared iosApp path was listed before but did not compile into the watch
      # bundle, so Text("app_name") etc. rendered as raw keys on watchOS 27.2.
      - path: ../watchApp/OmniGartWatch/Localizable.xcstrings
        buildPhase: resources
      - path: ../watchApp/OmniGartWatch/en-GB.lproj
      - path: ../watchApp/OmniGartWatch/uk.lproj
      - path: ../watchApp/OmniGartWatch/ContentBundle
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omnigart.ios.watchkitapp
        INFOPLIST_FILE: ../watchApp/OmniGartWatch/Info.plist
        TARGETED_DEVICE_FAMILY: "4"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(PLATFORM_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Shared -lsqlite3 -framework WatchConnectivity"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ONLY_ACTIVE_ARCH: YES
        # KMP ships watchosSimulatorArm64 only (watchosX64 deprecated).
        EXCLUDED_ARCHS[sdk=watchsimulator*]: "x86_64 i386"
        CODE_SIGN_ENTITLEMENTS: ../watchApp/OmniGartWatch/OmniGartWatch.entitlements
    dependencies:
      - sdk: WatchConnectivity.framework
    scheme:
      testTargets:
        - OmniGartWatchTests

  OmniGartWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: ../watchApp/OmniGartWatchTests
        createIntermediateGroups: false
    dependencies:
      - target: OmniGartWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omnigart.ios.watchkitapp.tests
        GENERATE_INFOPLIST_FILE: YES
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(PLATFORM_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Shared -lsqlite3"
        EXCLUDED_ARCHS[sdk=watchsimulator*]: "x86_64 i386"
