name: Evidence

on:
  pull_request:
    paths:
      - "content/evidence/**"
      - "content/exercises/**"
      - "tooling/evidence-verify/**"
      - "shared/evidence/**"
      - "scripts/build_evidence_catalog.py"
      - "scripts/migrate_evidence_refs.py"
      - ".github/workflows/evidence.yml"
  push:
    branches: [main, cursor/**]
    paths:
      - "content/evidence/**"
      - "content/exercises/**"
      - "tooling/evidence-verify/**"
      - "shared/evidence/**"
      - "scripts/build_evidence_catalog.py"
      - "scripts/migrate_evidence_refs.py"
      - ".github/workflows/evidence.yml"
  schedule:
    # Weekly Monday 06:15 UTC
    - cron: "15 6 * * 1"
  workflow_dispatch:

concurrency:
  group: evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  evidence:
    name: Evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tooling/evidence-verify/package-lock.json

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Restore evidence API cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: tooling/evidence-verify/.cache
          key: evidence-api-${{ runner.os }}-${{ hashFiles('content/evidence/catalog.json') }}
          restore-keys: |
            evidence-api-${{ runner.os }}-

      - name: Install verifier
        working-directory: tooling/evidence-verify
        run: npm ci

      - name: Schema + unit tests
        run: ./gradlew --stacktrace :shared:evidence:jvmTest :shared:planning:jvmTest

      - name: Verify DOIs and PMIDs
        id: verify
        working-directory: tooling/evidence-verify
        env:
          EVIDENCE_CONTACT_EMAIL: evidence@omnigart.dev
          EVIDENCE_REPORT_PATH: ${{ github.workspace }}/tooling/evidence-verify/last-report.json
          # PRs: soft-pass pure network errors when cache/retries exhausted.
          EVIDENCE_OFFLINE_OK: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: |
          set +e
          node src/verify.mjs --report
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "::error::Evidence resolve failures (unresolvable id / metadata mismatch / retraction)"
            exit 2
          fi
          if [ "$code" -eq 3 ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::warning::Evidence network errors after retries; PR soft-pass (cache/offline-ok)."
              exit 0
            fi
            echo "::error::Evidence network errors on scheduled/push run"
            exit 3
          fi
          exit "$code"

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-verify-report
          path: tooling/evidence-verify/last-report.json
          if-no-files-found: ignore

      - name: Open issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'tooling/evidence-verify/last-report.json';
            let body = 'Weekly evidence verification failed.\n\n';
            if (fs.existsSync(reportPath)) {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              body += '```json\n' + JSON.stringify(report, null, 2).slice(0, 60000) + '\n```\n';
            } else {
              body += 'No report artifact was produced. Check the Evidence workflow logs.\n';
            }
            body += `\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n`;
            const title = `Evidence verification failed (${new Date().toISOString().slice(0, 10)})`;
            const { owner, repo } = context.repo;
            let existing;
            try {
              existing = await github.rest.issues.listForRepo({
                owner,
                repo,
                state: 'open',
                labels: 'evidence',
                per_page: 20,
              });
            } catch (e) {
              existing = { data: [] };
            }
            const dup = existing.data.find((i) => i.title.startsWith('Evidence verification failed'));
            if (dup) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: dup.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ['evidence'],
              });
            }
