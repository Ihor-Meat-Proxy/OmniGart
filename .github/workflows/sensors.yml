# Sensors CI — pure KMP parser/HRV tests (+ Android unit tests when SDK is set up).
# Action SHAs verified Oct 2026 against upstream release tags.
name: Sensors

on:
  push:
    branches: [main, cursor/**, feat/**, chore/**]
  pull_request:
    branches: [main]

concurrency:
  group: sensors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sensors:
    name: Sensors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Verify sensors docs present
        run: |
          node -e "
            const fs = require('fs');
            for (const p of [
              'docs/SENSORS.md',
              'docs/third_party/POLAR_SDK.md',
              'docs/OPEN_QUESTIONS.md',
              'shared/sensors/build.gradle.kts',
              'android/sensors/build.gradle.kts',
              'ios/Packages/OmniGartSensors/Package.swift',
            ]) {
              if (!fs.existsSync(p)) {
                console.error('missing', p);
                process.exit(1);
              }
              console.log('ok', p);
            }
          "

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android platform / build-tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Sensors unit tests (shared/sensors)
        run: ./gradlew --stacktrace :shared:sensors:jvmTest

      - name: Sensors Android unit tests
        run: ./gradlew --stacktrace :android:sensors:testDebugUnitTest
