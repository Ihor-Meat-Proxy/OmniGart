name: Translations

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: translations-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Translations:
    name: Translations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/content_i18n/requirements.txt

      - name: Install tooling deps
        run: pip install -r scripts/content_i18n/requirements.txt

      - name: Validate translations
        run: python scripts/content_i18n/validate.py

      - name: Unit tests
        run: python -m pytest scripts/content_i18n/tests -q
