# Translations — locale/content paths only (keeps macOS/Android CI off for copy-only PRs).
name: Translations

on:
  push:
    branches: [main]
    paths:
      - 'content/**/locales/**'
      - 'content/**/locales/*.json'
      - 'content/exercises/data/**'
      - 'content/exercises/templates/**'
      - 'content/i18n/**'
      - '**/locales/**/*.json'
      - 'androidApp/**/res/values*/**'
      - 'iosApp/**/*InfoPlist.strings'
      - 'iosApp/**/*.xcstrings'
      - 'iosApp/project.yml'
      - 'watchApp/**/*InfoPlist.strings'
      - 'watchApp/**/*.xcstrings'
      - 'watchApp/**/*.swift'
      - 'iosApp/**/*.swift'
      - 'scripts/check_no_ru_locale.sh'
      - 'scripts/content_i18n/**'
      - 'scripts/check_swift_localization_keys.py'
      - 'scripts/sync_equipment_item_i18n.py'
      - 'scripts/data/equipment_item_i18n.json'
      - 'wearApp/**/res/values*/**'
      - 'i18n/locales.yml'
      - '.github/workflows/translations.yml'
  pull_request:
    paths:
      - 'content/**/locales/**'
      - 'content/**/locales/*.json'
      - 'content/exercises/data/**'
      - 'content/exercises/templates/**'
      - 'content/i18n/**'
      - '**/locales/**/*.json'
      - 'androidApp/**/res/values*/**'
      - 'iosApp/**/*InfoPlist.strings'
      - 'iosApp/**/*.xcstrings'
      - 'iosApp/project.yml'
      - 'watchApp/**/*InfoPlist.strings'
      - 'watchApp/**/*.xcstrings'
      - 'watchApp/**/*.swift'
      - 'iosApp/**/*.swift'
      - 'scripts/check_no_ru_locale.sh'
      - 'scripts/content_i18n/**'
      - 'scripts/check_swift_localization_keys.py'
      - 'scripts/sync_equipment_item_i18n.py'
      - 'scripts/data/equipment_item_i18n.json'
      - 'wearApp/**/res/values*/**'
      - 'i18n/locales.yml'
      - '.github/workflows/translations.yml'
  workflow_dispatch:

concurrency:
  group: translations-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  translations:
    name: Locale gates
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ban Russian locale catalogs
        run: bash ./scripts/check_no_ru_locale.sh

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/content_i18n/requirements.txt

      - name: Install tooling deps
        run: pip install -r scripts/content_i18n/requirements.txt

      - name: Validate translations
        run: python scripts/content_i18n/validate.py

      - name: Unit tests
        run: python -m pytest scripts/content_i18n/tests -q

      - name: Swift Text keys resolve in String Catalogs
        run: python3 scripts/check_swift_localization_keys.py

      - name: List touched locale trees
        run: |
          set -euo pipefail
          echo "Locale/content paths present:"
          find content -type d -name locales 2>/dev/null | sort || true
