name: Content infra validate

on:
  push:
    paths:
      - 'infra/**'
      - '.github/workflows/content-infra-validate.yml'
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/content-infra-validate.yml'

jobs:
  tofu-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/content
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false

      - name: Format check
        run: tofu fmt -check -recursive

      - name: Init (no backend)
        run: tofu init -backend=false -input=false

      - name: Validate
        run: tofu validate -no-color
        # No plan/apply — no real secrets, no cloud mutations in CI
